schema: spec-driven

context: |
  Tech stack: Go, DiscordGo, GORM, PostgreSQL
  Architecture: Feature-based modules in internal/features, manual feature registration in cmd/bot/main.go
  Models: Each feature owns its GORM models in-package; feature Models() is aggregated in cmd/bot/main.go and passed to database.Migrate. members models live in a leaf package internal/features/members/model to avoid an import cycle with members/subcommands.
  Living specs: One spec per feature module at internal/features/<name>/spec.md. OpenSpec spec management (openspec/specs/) is retired; spec deltas from each change are applied to the co-located feature spec by a custom sync step (see AGENTS.md "SDD Workflow") before archive.
  API conventions: Discord slash commands + event handlers
  Testing: Tests live next to the code they cover (*_test.go); testify is used for assertions. After ANY code change the 4 checks in AGENTS.md MUST pass (build, vet, gofmt, tests).
  Style: Idiomatic Go, gofmt formatting, clear feature boundaries

rules:
  proposal:
    - Include rollback plan
    - List affected internal/features/<name> paths
    - Note whether the change adds or modifies a feature's living spec at internal/features/<name>/spec.md
  specs:
    - Spec deltas MUST target a feature: delta directory named after the feature (e.g. specs/finance/), one delta per feature per change
    - Use Given/When/Then format for scenarios
    - Scenarios that touch persistence MUST reference the owning feature's model package (e.g. members/model.WelcomeRole)
  design:
    - Include sequence diagrams for complex command/event flows, adapted to Discord interactions
    - Note any new GORM models and whether a new feature/model-style leaf package is introduced

operations:
  archive:
    guidance:
      - ALWAYS pass --skip-specs (OpenSpec spec management is retired; openspec/specs/ does not exist). The co-located spec at internal/features/<feature>/spec.md is updated by the custom sync step documented in AGENTS.md, not by the OpenSpec archive merge.
      - After archiving, confirm the change's spec delta has been applied to internal/features/<feature>/spec.md (the mandatory co-located sync step) before considering the workflow done.